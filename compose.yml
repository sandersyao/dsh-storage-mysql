services:
  # 本地开发/测试用的 MySQL。本机已缓存 mysql:8.4（Docker Hub 在此环境不可达）。
  mysql:
    image: mysql:8.4
    container_name: dsh-storage-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev_password}
      MYSQL_DATABASE: ${STORAGE_DATABASE:-dsh_storage}
      MYSQL_USER: ${STORAGE_USER:-dsh}
      MYSQL_PASSWORD: ${STORAGE_PASSWORD:-dsh_dev_password}
    ports:
      - "${STORAGE_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-root_dev_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
