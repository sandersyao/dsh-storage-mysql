# dsh 组合包 patch 层：保留默认 json 后端，把域层默认路由切到 MySQL 存储后端。
# 当用户 `dsh plugin add @sandersyao/dsh-storage-mysql` 后，
# 该文件作为本 bundle 的配置层被应用到 profile。
#
# 说明：
# - patch 按插件 `id` 定位、后应用者覆盖先应用者；`disabled: true` 停用默认 storage-json。
# - `storage-domain` 的 `config.backend` 改为 `mysql`，域层所有 domain 默认路由到本后端。
#   如需保留 json 并按域分流，不 disabled storage-json，改为给 storage-domain 配 `routes:`
#   （把特定 domain 映射到 `mysql`，其余走默认 backend）。
# - `insert:` 追加新行；`name` 是包名，loader 用其默认导出构造插件。
# - `config` 可选；主机/库/凭据由环境变量 `STORAGE_*`（回退 `MYSQL_*`）提供，
#   `connection.tablePrefix` 可在此覆盖 env 的 `STORAGE_TABLE_PREFIX`。
- id: storage-domain
  config:
    backend: mysql

- insert:
    - id: storage-mysql
      name: '@sandersyao/dsh-storage-mysql'
      config:
        connection:
          tablePrefix: dsh_storage_